                    <div className="grid gap-3 md:hidden">{payments.map((payment) => <Card key={payment.id}><CardContent className="space-y-3 p-4"><div className="flex items-start justify-between gap-2"><div><p className="font-medium">{name(payment.tenant)}</p><p className="text-xs text-muted-foreground">{payment.lease.unit.unitNumber} · {name(payment.lease.unit.property)}</p></div><Badge className={STATUS_COLORS[payment.status] || DEFAULT_STATUS_COLOR}>{statusLabel(payment.status)}</Badge></div><div className="grid grid-cols-2 gap-2 text-sm"><div><p className="text-xs text-muted-foreground">{copy.gross}</p><p>{money.format(payment.amount)}</p></div><div><p className="text-xs text-muted-foreground">{copy.net}</p><p className="font-semibold">{money.format(payment.netAmount)}</p></div><div><p className="text-xs text-muted-foreground">{copy.due}</p><p>{date(payment.dueDate)}</p></div><div><p className="text-xs text-muted-foreground">{copy.method}</p><p>{methodLabel(payment.method)}</p></div></div>{actionButtons(payment)}</CardContent></Card>)}</div>
                    <div className="hidden overflow-x-auto rounded-lg border md:block"><Table><TableHeader><TableRow><TableHead>{copy.tenant}</TableHead><TableHead>{copy.property}</TableHead><TableHead>{copy.gross}</TableHead><TableHead>{copy.net}</TableHead><TableHead>{copy.refunded}</TableHead><TableHead>{copy.due}</TableHead><TableHead>{copy.method}</TableHead><TableHead>{copy.status}</TableHead><TableHead className="text-end">{copy.actions}</TableHead></TableRow></TableHeader><TableBody>{payments.map((payment) => <TableRow key={payment.id}><TableCell className="font-medium">{name(payment.tenant)}</TableCell><TableCell>{payment.lease.unit.unitNumber} · {name(payment.lease.unit.property)}</TableCell><TableCell>{money.format(payment.amount)}</TableCell><TableCell className="font-semibold">{money.format(payment.netAmount)}</TableCell><TableCell>{payment.refundedAmount ? money.format(payment.refundedAmount) : '—'}</TableCell><TableCell>{date(payment.dueDate)}</TableCell><TableCell>{methodLabel(payment.method)}</TableCell><TableCell><Badge className={STATUS_COLORS[payment.status] || DEFAULT_STATUS_COLOR}>{statusLabel(payment.status)}</Badge></TableCell><TableCell>{actionButtons(payment)}</TableCell></TableRow>)}</TableBody></Table></div>
                    <div className="flex items-center justify-between"><Button variant="outline" disabled={pagination.page <= 1} onClick={() => load(pagination.page - 1)}>{copy.previous}</Button><span className="text-sm text-muted-foreground">{pagination.page} / {Math.max(1, pagination.totalPages)}</span><Button variant="outline" disabled={pagination.page >= pagination.totalPages} onClick={() => load(pagination.page + 1)}>{copy.next}</Button></div>
                  </>
                )}

                <Dialog open={formOpen} onOpenChange={setFormOpen}><DialogContent className="max-w-xl max-h-[90vh] overflow-y-auto"><DialogHeader><DialogTitle>{editingId ? copy.edit : copy.add}</DialogTitle></DialogHeader><form onSubmit={submit} className="space-y-4"><div className="space-y-2"><Label>{copy.lease}</Label><Select value={form.leaseId} disabled={Boolean(editingId)} onValueChange={(leaseId) => { const lease = leases.find((item) => item.id === leaseId); setForm({ ...form, leaseId, tenantId: lease?.tenant.id || '', amount: lease ? String(lease.rentAmount) : form.amount }); }}><SelectTrigger><SelectValue placeholder={copy.selectLease} /></SelectTrigger><SelectContent>{leases.map((lease) => <SelectItem key={lease.id} value={lease.id}>{name(lease.tenant)} — {lease.unit.unitNumber} · {name(lease.unit.property)}</SelectItem>)}</SelectContent></Select></div><div className="grid gap-4 sm:grid-cols-2"><div className="space-y-2"><Label>{copy.amount}</Label><Input type="number" min="0.01" step="0.01" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} required /></div><div className="space-y-2"><Label>{copy.due}</Label><Input type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} required /></div><div className="space-y-2"><Label>{copy.paid}</Label><Input type="date" value={form.paidDate} onChange={(e) => setForm({ ...form, paidDate: e.target.value })} /></div><div className="space-y-2"><Label>{copy.status}</Label><Select value={form.status} onValueChange={(status) => setForm({ ...form, status })}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent>{['pending','paid','late','partial'].map((status) => <SelectItem key={status} value={status}>{statusLabel(status)}</SelectItem>)}</SelectContent></Select></div><div className="space-y-2"><Label>{copy.method}</Label><Select value={form.method || 'none'} onValueChange={(method) => setForm({ ...form, method: method === 'none' ? '' : method })}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent><SelectItem value="none">—</SelectItem>{['cash','bank_transfer','online','check'].map((method) => <SelectItem key={method} value={method}>{methodLabel(method)}</SelectItem>)}</SelectContent></Select></div><div className="space-y-2"><Label>{copy.reference}</Label><Input value={form.reference} onChange={(e) => setForm({ ...form, reference: e.target.value })} /></div></div><div className="space-y-2"><Label>{copy.notes}</Label><Textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></div><DialogFooter><Button type="button" variant="outline" onClick={() => setFormOpen(false)}>{copy.cancel}</Button><Button disabled={saving || !form.leaseId || !form.amount || !form.dueDate}>{saving && <Loader2 className="me-2 h-4 w-4 animate-spin" />}{copy.save}</Button></DialogFooter></form></DialogContent></Dialog>

                <Dialog open={Boolean(lifecycle)} onOpenChange={(open) => !open && setLifecycle(null)}><DialogContent><DialogHeader><DialogTitle>{lifecycle?.type === 'refund' ? copy.refundTitle : copy.voidTitle}</DialogTitle></DialogHeader><form onSubmit={applyLifecycle} className="space-y-4">{lifecycle?.type === 'refund' && <><div className="rounded-lg bg-muted p-3 text-sm">{copy.available}: <strong>{money.format(lifecycle.payment.netAmount)}</strong></div><div className="space-y-2"><Label>{copy.amount}</Label><Input type="number" min="0.01" step="0.01" max={lifecycle.payment.netAmount} value={refundAmount} onChange={(e) => setRefundAmount(e.target.value)} required /></div></>}<div className="space-y-2"><Label>{copy.reason}</Label><Textarea minLength={3} maxLength={500} value={reason} onChange={(e) => setReason(e.target.value)} required /></div><DialogFooter><Button type="button" variant="outline" onClick={() => setLifecycle(null)}>{copy.cancel}</Button><Button disabled={saving || reason.trim().length < 3 || (lifecycle?.type === 'refund' && Number(refundAmount) <= 0)}>{saving && <Loader2 className="me-2 h-4 w-4 animate-spin" />}{copy.confirm}</Button></DialogFooter></form></DialogContent></Dialog>

                <PaymentReceipt open={Boolean(receipt)} onOpenChange={(open) => !open && setReceipt(null)} payment={receipt} />
              </div>
            );
          }
          TSX

          rm -f .github/workflows/phase4-accounting.yml

      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run build

      - name: Publish validated accounting lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve payment history with void and refund adjustments [accounting finalized]"
          git push origin HEAD:agent/stabilize-core-workflows
