name: Apply payment lifecycle and net reporting

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: phase4-accounting
  cancel-in-progress: true

jobs:
  accounting:
    if: ${{ contains(github.event.head_commit.message, '[start accounting phase]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify fixed-precision prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/money.ts
          grep -q 'amount.*Decimal.*@db.Decimal(18, 2)' prisma/schema.prisma
          grep -q 'rentAmount.*Decimal.*@db.Decimal(18, 2)' prisma/schema.prisma

      - name: Add immutable payment-adjustment ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          if 'paymentAdjustments PaymentAdjustment[]' not in text:
              anchor = '  activityLogs        ActivityLog[]\n'
              if anchor not in text:
                  raise SystemExit('Organization relation anchor not found')
              text = text.replace(anchor, anchor + '  paymentAdjustments  PaymentAdjustment[]\n', 1)
          if '  adjustments    PaymentAdjustment[]\n' not in text:
              anchor = '  updatedAt      DateTime     @updatedAt\n\n  @@index([organizationId, status])\n'
              if anchor not in text:
                  raise SystemExit('Payment relation anchor not found')
              text = text.replace(anchor, '  updatedAt      DateTime     @updatedAt\n  adjustments    PaymentAdjustment[]\n\n  @@index([organizationId, status])\n', 1)
          if 'model PaymentAdjustment {' not in text:
              marker = '\nmodel MaintenanceRequest {'
              if marker not in text:
                  raise SystemExit('PaymentAdjustment insertion anchor not found')
              model = '''

model PaymentAdjustment {
  id              String       @id @default(cuid())
  organizationId  String       @default("org_default")
  organization    Organization @relation(fields: [organizationId], references: [id], onDelete: Cascade)
  paymentId       String
  payment         Payment      @relation(fields: [paymentId], references: [id], onDelete: Restrict)
  type            String
  amount          Decimal      @default(0) @db.Decimal(18, 2)
  reason          String
  createdByUserId String?
  createdAt       DateTime     @default(now())

  @@index([organizationId, paymentId])
  @@index([organizationId, type, createdAt])
}
'''
              text = text.replace(marker, model + marker, 1)
          schema.write_text(text)

          db = Path('src/lib/db.ts')
          db_text = db.read_text()
          old = "  'MaintenanceRequest', 'Message', 'ActivityLog',\n"
          new = "  'MaintenanceRequest', 'Message', 'ActivityLog', 'PaymentAdjustment',\n"
          if old in db_text:
              db_text = db_text.replace(old, new, 1)
          if "'PaymentAdjustment'" not in db_text:
              raise SystemExit('Unable to add PaymentAdjustment to organization scope')
          db.write_text(db_text)
          PY

          mkdir -p prisma/migrations/20260729_payment_lifecycle
          cat > prisma/migrations/20260729_payment_lifecycle/migration.sql <<'SQL'
          -- Immutable payment lifecycle adjustments. Original payments remain intact.
          CREATE TABLE IF NOT EXISTS "PaymentAdjustment" (
            "id" TEXT NOT NULL,
            "organizationId" TEXT NOT NULL DEFAULT 'org_default',
            "paymentId" TEXT NOT NULL,
            "type" TEXT NOT NULL,
            "amount" NUMERIC(18,2) NOT NULL DEFAULT 0,
            "reason" TEXT NOT NULL,
            "createdByUserId" TEXT,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "PaymentAdjustment_pkey" PRIMARY KEY ("id"),
            CONSTRAINT "PaymentAdjustment_organizationId_fkey" FOREIGN KEY ("organizationId") REFERENCES "Organization"("id") ON DELETE CASCADE ON UPDATE CASCADE,
            CONSTRAINT "PaymentAdjustment_paymentId_fkey" FOREIGN KEY ("paymentId") REFERENCES "Payment"("id") ON DELETE RESTRICT ON UPDATE CASCADE,
            CONSTRAINT "PaymentAdjustment_type_amount_check" CHECK (
              ("type" = 'void' AND "amount" = 0) OR
              ("type" = 'refund' AND "amount" > 0)
            )
          );

          CREATE INDEX IF NOT EXISTS "PaymentAdjustment_organizationId_paymentId_idx"
            ON "PaymentAdjustment"("organizationId", "paymentId");
          CREATE INDEX IF NOT EXISTS "PaymentAdjustment_organizationId_type_createdAt_idx"
            ON "PaymentAdjustment"("organizationId", "type", "createdAt");

          CREATE OR REPLACE FUNCTION "PropManager_scope_payment_adjustment"()
          RETURNS TRIGGER AS $$
          DECLARE payment_org TEXT;
          BEGIN
            SELECT "organizationId" INTO payment_org FROM "Payment" WHERE "id" = NEW."paymentId";
            IF payment_org IS NULL THEN
              RAISE EXCEPTION 'Payment % does not exist', NEW."paymentId";
            END IF;
            NEW."organizationId" := payment_org;
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS "PaymentAdjustment_scope_organization" ON "PaymentAdjustment";
          CREATE TRIGGER "PaymentAdjustment_scope_organization"
          BEFORE INSERT OR UPDATE OF "paymentId", "organizationId" ON "PaymentAdjustment"
          FOR EACH ROW EXECUTE FUNCTION "PropManager_scope_payment_adjustment"();
          SQL

          cat > src/lib/payment-ledger.ts <<'TS'
          import { Prisma } from '@prisma/client';
          import { moneyDecimal, type MoneyValue } from '@/lib/money';

          export interface LedgerAdjustment {
            type: string;
            amount: MoneyValue;
          }

          export interface LedgerPayment {
            amount: MoneyValue;
            status: string;
            adjustments?: LedgerAdjustment[];
          }

          export const SETTLED_PAYMENT_STATUSES = ['paid', 'partial', 'partially_refunded', 'refunded'] as const;
          export const LOCKED_PAYMENT_STATUSES = ['voided', 'partially_refunded', 'refunded'] as const;

          export function refundTotal(adjustments: LedgerAdjustment[] | undefined) {
            return (adjustments || []).reduce(
              (total, adjustment) => adjustment.type === 'refund' ? total.plus(moneyDecimal(adjustment.amount)) : total,
              new Prisma.Decimal(0),
            ).toDecimalPlaces(2, Prisma.Decimal.ROUND_HALF_UP);
          }

          export function netCollectedAmount(payment: LedgerPayment) {
            if (payment.status === 'voided') return new Prisma.Decimal(0);
            return Prisma.Decimal.max(
              new Prisma.Decimal(0),
              moneyDecimal(payment.amount).minus(refundTotal(payment.adjustments)),
            ).toDecimalPlaces(2, Prisma.Decimal.ROUND_HALF_UP);
          }

          export function refundableAmount(payment: LedgerPayment) {
            if (!SETTLED_PAYMENT_STATUSES.includes(payment.status as (typeof SETTLED_PAYMENT_STATUSES)[number])) {
              return new Prisma.Decimal(0);
            }
            return netCollectedAmount(payment);
          }

          export function statusAfterRefund(payment: LedgerPayment, refund: MoneyValue) {
            const nextTotal = refundTotal(payment.adjustments).plus(moneyDecimal(refund));
            return nextTotal.greaterThanOrEqualTo(moneyDecimal(payment.amount)) ? 'refunded' : 'partially_refunded';
          }
          TS

          mkdir -p tests
          cat > tests/payment-ledger.test.ts <<'TS'
          import { describe, expect, test } from 'bun:test';
          import { netCollectedAmount, refundableAmount, refundTotal, statusAfterRefund } from '../src/lib/payment-ledger';

          describe('payment adjustment ledger', () => {
            test('keeps the original payment immutable while calculating net cash', () => {
              const payment = {
                amount: '1000.00',
                status: 'partially_refunded',
                adjustments: [{ type: 'refund', amount: '125.50' }],
              };
              expect(refundTotal(payment.adjustments).toFixed(2)).toBe('125.50');
              expect(netCollectedAmount(payment).toFixed(2)).toBe('874.50');
              expect(refundableAmount(payment).toFixed(2)).toBe('874.50');
            });

            test('recognizes a full refund without floating-point drift', () => {
              const payment = {
                amount: '0.30',
                status: 'paid',
                adjustments: [{ type: 'refund', amount: '0.10' }],
              };
              expect(statusAfterRefund(payment, '0.20')).toBe('refunded');
            });

            test('voided and unsettled entries contribute no refundable cash', () => {
              expect(refundableAmount({ amount: '50.00', status: 'pending' }).toFixed(2)).toBe('0.00');
              expect(netCollectedAmount({ amount: '50.00', status: 'voided' }).toFixed(2)).toBe('0.00');
            });
          });
          TS

      - run: bun ci
      - run: bun run db:generate

      - name: Add payment lifecycle APIs and net-aware list endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'src/app/api/payments/[id]/void' 'src/app/api/payments/[id]/refund'
          cat > 'src/app/api/payments/[id]/void/route.ts' <<'TS'
          import { NextRequest, NextResponse } from 'next/server';
          import { db } from '@/lib/db';
          import { apiError, requestRateLimit } from '@/lib/api';
          import { auditEntry } from '@/lib/audit';
          import { getRequestSession } from '@/lib/server-session';

          export async function POST(request: NextRequest, { params }: { params: Promise<{ id: string }> }) {
            const limit = requestRateLimit(request, 'payments:void', { maxRequests: 30 });
            if (!limit.success) return apiError('Too many requests', 429);
            const session = await getRequestSession(request);
            if (!session) return apiError('Authentication required.', 401);
            const body = await request.json().catch(() => ({}));
            const reason = typeof body.reason === 'string' ? body.reason.trim() : '';
            if (reason.length < 3 || reason.length > 500) return apiError('A void reason between 3 and 500 characters is required.', 400);
            const { id } = await params;

            const payment = await db.payment.findUnique({ where: { id }, include: { adjustments: true } });
            if (!payment) return apiError('Payment not found.', 404);
            if (!['pending', 'late'].includes(payment.status)) {
              return apiError('Only unsettled payments can be voided. Use a refund for collected money.', 409);
            }

            const updated = await db.$transaction(async (transaction) => {
              const result = await transaction.payment.update({ where: { id }, data: { status: 'voided', paidDate: null } });
              await transaction.paymentAdjustment.create({
                data: { paymentId: id, type: 'void', amount: 0, reason, createdByUserId: session.userId },
              });
              await transaction.activityLog.create({
                data: auditEntry('void', 'payment', id, { reason, previousStatus: payment.status, amount: Number(payment.amount) }),
              });
              return result;
            });
            return NextResponse.json({ payment: { ...updated, amount: Number(updated.amount), netAmount: 0 } });
          }
          TS

          cat > 'src/app/api/payments/[id]/refund/route.ts' <<'TS'
          import { NextRequest, NextResponse } from 'next/server';
          import { db } from '@/lib/db';
          import { apiError, requestRateLimit } from '@/lib/api';
          import { auditEntry } from '@/lib/audit';
          import { getRequestSession } from '@/lib/server-session';
          import { moneyDecimal } from '@/lib/money';
          import { refundableAmount, refundTotal, statusAfterRefund } from '@/lib/payment-ledger';

          export async function POST(request: NextRequest, { params }: { params: Promise<{ id: string }> }) {
            const limit = requestRateLimit(request, 'payments:refund', { maxRequests: 30 });
            if (!limit.success) return apiError('Too many requests', 429);
            const session = await getRequestSession(request);
            if (!session) return apiError('Authentication required.', 401);
            const body = await request.json().catch(() => ({}));
            const reason = typeof body.reason === 'string' ? body.reason.trim() : '';
            if (reason.length < 3 || reason.length > 500) return apiError('A refund reason between 3 and 500 characters is required.', 400);
            let requested;
            try { requested = moneyDecimal(String(body.amount ?? '')); } catch { return apiError('A valid refund amount is required.', 400); }
            if (requested.lessThanOrEqualTo(0)) return apiError('Refund amount must be greater than zero.', 400);
            const { id } = await params;

            const payment = await db.payment.findUnique({ where: { id }, include: { adjustments: true } });
            if (!payment) return apiError('Payment not found.', 404);
            const available = refundableAmount(payment);
            if (available.lessThanOrEqualTo(0)) return apiError('This payment has no refundable balance.', 409);
            if (requested.greaterThan(available)) {
              return apiError(`Refund exceeds the available balance of ${available.toFixed(2)}.`, 409);
            }
            const nextStatus = statusAfterRefund(payment, requested);

            const result = await db.$transaction(async (transaction) => {
              const adjustment = await transaction.paymentAdjustment.create({
                data: { paymentId: id, type: 'refund', amount: requested, reason, createdByUserId: session.userId },
              });
              const updated = await transaction.payment.update({ where: { id }, data: { status: nextStatus } });
              await transaction.activityLog.create({
                data: auditEntry('refund', 'payment', id, {
                  adjustmentId: adjustment.id,
                  amount: requested.toNumber(),
                  reason,
                  status: nextStatus,
                }),
              });
              return { adjustment, updated };
            });

            const refunded = refundTotal([...payment.adjustments, result.adjustment]);
            return NextResponse.json({
              payment: {
                ...result.updated,
                amount: Number(result.updated.amount),
                refundedAmount: refunded.toNumber(),
                netAmount: moneyDecimal(result.updated.amount).minus(refunded).toNumber(),
              },
            });
          }
          TS

          cat > src/app/api/payments/route.ts <<'TS'
          import { Prisma } from '@prisma/client';
          import { db } from '@/lib/db';
          import { NextRequest, NextResponse } from 'next/server';
          import { apiError, getPagination, requestRateLimit } from '@/lib/api';
          import { auditEntry } from '@/lib/audit';
          import { moneyDecimal, moneyNumber } from '@/lib/money';
          import { LOCKED_PAYMENT_STATUSES, netCollectedAmount, refundTotal } from '@/lib/payment-ledger';
          import { paymentSchema, paymentUpdateSchema, sanitizeString } from '@/lib/validation';

          const paymentInclude = {
            tenant: { select: { id: true, name: true, nameAr: true } },
            lease: { include: { unit: { include: { property: { select: { name: true, nameAr: true } } } } } },
            adjustments: { orderBy: { createdAt: 'asc' as const } },
          } satisfies Prisma.PaymentInclude;

          type PaymentRow = Prisma.PaymentGetPayload<{ include: typeof paymentInclude }>;

          function serializePayment(payment: PaymentRow) {
            const refunded = refundTotal(payment.adjustments);
            return {
              ...payment,
              amount: moneyNumber(payment.amount),
              refundedAmount: refunded.toNumber(),
              netAmount: netCollectedAmount(payment).toNumber(),
              adjustments: payment.adjustments.map((adjustment) => ({ ...adjustment, amount: moneyNumber(adjustment.amount) })),
            };
          }

          function resolvePaidDate(status: string, requested: string | null | undefined, current: Date | null = null) {
            if (status === 'paid' || status === 'partial') {
              if (requested) {
                const parsed = new Date(requested);
                if (!Number.isFinite(parsed.getTime())) throw new Error('INVALID_PAID_DATE');
                return parsed;
              }
              return current ?? new Date();
            }
            return null;
          }

          export async function GET(request: NextRequest) {
            try {
              const limitResult = requestRateLimit(request, 'payments:read');
              if (!limitResult.success) return apiError('Too many requests', 429);
              const { searchParams } = new URL(request.url);
              const status = searchParams.get('status') || '';
              const method = searchParams.get('method') || '';
              const { page, limit, skip } = getPagination(searchParams);
              const where: Prisma.PaymentWhereInput = {};
              if (status && status !== 'all') where.status = status;
              if (method && method !== 'all') where.method = method;
              const statsWhere: Prisma.PaymentWhereInput = {};
              if (method && method !== 'all') statsWhere.method = method;

              const [payments, total, statsPayments] = await Promise.all([
                db.payment.findMany({ where, skip, take: limit, include: paymentInclude, orderBy: { dueDate: 'desc' } }),
                db.payment.count({ where }),
                db.payment.findMany({ where: statsWhere, include: { adjustments: true } }),
              ]);
              const stats = statsPayments.reduce((result, payment) => {
                if (['paid', 'partial', 'partially_refunded', 'refunded'].includes(payment.status)) {
                  result.totalCollected += netCollectedAmount(payment).toNumber();
                } else if (payment.status === 'pending') {
                  result.totalPending += moneyNumber(payment.amount);
                } else if (payment.status === 'late') {
                  result.totalLate += moneyNumber(payment.amount);
                }
                return result;
              }, { totalCollected: 0, totalPending: 0, totalLate: 0 });

              const response = NextResponse.json({
                data: payments.map(serializePayment),
                stats,
                pagination: { page, limit, total, totalPages: Math.ceil(total / limit) },
              });
              response.headers.set('Cache-Control', 'private, max-age=5, stale-while-revalidate=10');
              return response;
            } catch (error) {
              console.error('Payments GET error:', error);
              return apiError('Failed to fetch payments', 500);
            }
          }

          export async function POST(request: NextRequest) {
            try {
              const limitResult = requestRateLimit(request, 'payments:write', { maxRequests: 90 });
              if (!limitResult.success) return apiError('Too many requests', 429);
              const body = await request.json();
              const parsed = paymentSchema.safeParse(body);
              if (!parsed.success) return apiError('Validation failed', 400, parsed.error.issues);
              const data = parsed.data;
              const lease = await db.lease.findUnique({ where: { id: data.leaseId }, select: { tenantId: true } });
              if (!lease) return apiError('Lease not found', 404);
              if (data.tenantId && data.tenantId !== lease.tenantId) return apiError('The selected tenant does not belong to this lease.', 400);
              const dueDate = new Date(data.dueDate);
              if (!Number.isFinite(dueDate.getTime())) return apiError('Invalid due date.', 400);
              const status = data.status || 'pending';
              const paidDate = resolvePaidDate(status, data.paidDate);

              const payment = await db.$transaction(async (transaction) => {
                const created = await transaction.payment.create({
                  data: {
                    leaseId: data.leaseId,
                    tenantId: lease.tenantId,
                    amount: moneyDecimal(data.amount),
                    dueDate,
                    paidDate,
                    status,
                    method: data.method ?? null,
                    reference: data.reference ? sanitizeString(data.reference, 100) : null,
                    notes: data.notes ? sanitizeString(data.notes, 1000) : null,
                  },
                  include: paymentInclude,
                });
                await transaction.activityLog.create({
                  data: auditEntry('create', 'payment', created.id, {
                    leaseId: created.leaseId,
                    tenantId: created.tenantId,
                    amount: moneyNumber(created.amount),
                    status: created.status,
                  }),
                });
                return created;
              });
              return NextResponse.json(serializePayment(payment), { status: 201 });
            } catch (error) {
              if (error instanceof Error && error.message === 'INVALID_PAID_DATE') return apiError('Invalid paid date.', 400);
              console.error('Payments POST error:', error);
              return apiError('Failed to create payment', 500);
            }
          }

          export async function PUT(request: NextRequest) {
            try {
              const limitResult = requestRateLimit(request, 'payments:write', { maxRequests: 90 });
              if (!limitResult.success) return apiError('Too many requests', 429);
              const body = await request.json();
              const parsed = paymentUpdateSchema.safeParse(body);
              if (!parsed.success) return apiError('Validation failed', 400, parsed.error.issues);
              const data = parsed.data;
              const existing = await db.payment.findUnique({ where: { id: data.id }, include: { adjustments: true } });
              if (!existing) return apiError('Payment not found', 404);
              if (LOCKED_PAYMENT_STATUSES.includes(existing.status as (typeof LOCKED_PAYMENT_STATUSES)[number])) {
                return apiError('Lifecycle-adjusted payments are immutable. Add another refund adjustment instead.', 409);
              }
              if (data.leaseId !== undefined && data.leaseId !== existing.leaseId) {
                return apiError('A recorded payment cannot be reassigned to another lease.', 409);
              }
              const lease = await db.lease.findUnique({ where: { id: existing.leaseId }, select: { tenantId: true } });
              if (!lease) return apiError('Lease not found', 404);
              if (data.tenantId && data.tenantId !== lease.tenantId) return apiError('The selected tenant does not belong to this lease.', 400);

              const status = data.status ?? existing.status;
              const remainsSettled = status === 'paid' || status === 'partial';
              const wasSettled = existing.status === 'paid' || existing.status === 'partial';
              const changesAmount = data.amount !== undefined && !moneyDecimal(data.amount).equals(existing.amount);
              const changesDueDate = data.dueDate !== undefined && new Date(data.dueDate).getTime() !== existing.dueDate.getTime();
              if (wasSettled && remainsSettled && (changesAmount || changesDueDate)) {
                return apiError('Move the payment back to pending before correcting its amount or due date.', 409);
              }

              const updateData: Prisma.PaymentUncheckedUpdateInput = {
                leaseId: existing.leaseId,
                tenantId: lease.tenantId,
                status,
                paidDate: resolvePaidDate(status, data.paidDate, existing.paidDate),
              };
              if (data.amount !== undefined) updateData.amount = moneyDecimal(data.amount);
              if (data.dueDate !== undefined) {
                const dueDate = new Date(data.dueDate);
                if (!Number.isFinite(dueDate.getTime())) return apiError('Invalid due date.', 400);
                updateData.dueDate = dueDate;
              }
              if (data.method !== undefined) updateData.method = data.method;
              if (data.reference !== undefined) updateData.reference = data.reference ? sanitizeString(data.reference, 100) : null;
              if (data.notes !== undefined) updateData.notes = data.notes ? sanitizeString(data.notes, 1000) : null;

              const payment = await db.$transaction(async (transaction) => {
                const updated = await transaction.payment.update({ where: { id: data.id }, data: updateData, include: paymentInclude });
                await transaction.activityLog.create({
                  data: auditEntry('update', 'payment', data.id, {
                    fields: Object.keys(data).filter((key) => key !== 'id'),
                    amount: moneyNumber(updated.amount),
                    status: updated.status,
                  }),
                });
                return updated;
              });
              return NextResponse.json(serializePayment(payment));
            } catch (error) {
              if (error instanceof Error && error.message === 'INVALID_PAID_DATE') return apiError('Invalid paid date.', 400);
              console.error('Payments PUT error:', error);
              return apiError('Failed to update payment', 500);
            }
          }

          export async function DELETE(request: NextRequest) {
            const limitResult = requestRateLimit(request, 'payments:write', { maxRequests: 90 });
            if (!limitResult.success) return apiError('Too many requests', 429);
            return apiError('Payments are never deleted. Void an unsettled entry or refund collected money to preserve the audit trail.', 405);
          }
          TS

      - name: Replace reports with net cash and refund-aware calculations
        shell: bash
        run: |
          cat > src/app/api/reports/route.ts <<'TS'
          import { NextRequest, NextResponse } from 'next/server';
          import { db } from '@/lib/db';
          import { apiError, requestRateLimit } from '@/lib/api';
          import { moneyDecimal, moneyNumber } from '@/lib/money';
          import { netCollectedAmount } from '@/lib/payment-ledger';

          function getPeriodRange(period: string) {
            const now = new Date();
            if (period === 'lastMonth') return { startDate: new Date(now.getFullYear(), now.getMonth() - 1, 1), endDate: new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999) };
            if (period === 'thisQuarter') {
              const startMonth = Math.floor(now.getMonth() / 3) * 3;
              return { startDate: new Date(now.getFullYear(), startMonth, 1), endDate: new Date(now.getFullYear(), startMonth + 3, 0, 23, 59, 59, 999) };
            }
            if (period === 'thisYear') return { startDate: new Date(now.getFullYear(), 0, 1), endDate: new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999) };
            return { startDate: new Date(now.getFullYear(), now.getMonth(), 1), endDate: new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999) };
          }

          export async function GET(request: NextRequest) {
            try {
              const limit = requestRateLimit(request, 'reports:read', { maxRequests: 60 });
              if (!limit.success) return apiError('Too many requests', 429);
              const period = new URL(request.url).searchParams.get('period') || 'thisMonth';
              const { startDate, endDate } = getPeriodRange(period);
              const now = new Date();
              const twelveMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 11, 1);

              const [duePayments, collectedPayments, periodRefunds, trendPayments, trendRefunds] = await Promise.all([
                db.payment.findMany({
                  where: { dueDate: { gte: startDate, lte: endDate }, status: { not: 'voided' } },
                  include: { adjustments: true, lease: { select: { rentAmount: true } } },
                }),
                db.payment.findMany({
                  where: { status: { in: ['paid', 'partial', 'partially_refunded', 'refunded'] }, paidDate: { gte: startDate, lte: endDate } },
                  include: {
                    tenant: { select: { id: true, name: true, nameAr: true } },
                    lease: { select: { unit: { select: { property: { select: { id: true, name: true, nameAr: true } } } } } },
                  },
                }),
                db.paymentAdjustment.findMany({
                  where: { type: 'refund', createdAt: { gte: startDate, lte: endDate } },
                  include: {
                    payment: {
                      include: {
                        tenant: { select: { id: true, name: true, nameAr: true } },
                        lease: { select: { unit: { select: { property: { select: { id: true, name: true, nameAr: true } } } } } },
                      },
                    },
                  },
                }),
                db.payment.findMany({
                  where: { status: { in: ['paid', 'partial', 'partially_refunded', 'refunded'] }, paidDate: { gte: twelveMonthsAgo } },
                  select: { amount: true, paidDate: true },
                }),
                db.paymentAdjustment.findMany({
                  where: { type: 'refund', createdAt: { gte: twelveMonthsAgo } },
                  select: { amount: true, createdAt: true },
                }),
              ]);

              const expectedAmount = (payment: (typeof duePayments)[number]) =>
                payment.status === 'partial' || payment.status === 'partially_refunded' || payment.status === 'refunded'
                  ? PrismaDecimalMax(payment.lease.rentAmount, payment.amount)
                  : moneyDecimal(payment.amount);
              const totalExpected = duePayments.reduce((sum, payment) => sum.plus(expectedAmount(payment)), moneyDecimal(0));
              const collectedAgainstDue = duePayments.reduce((sum, payment) => sum.plus(netCollectedAmount(payment)), moneyDecimal(0));
              const outstandingAmount = PrismaDecimalMax(0, totalExpected.minus(collectedAgainstDue));

              const collectedGross = collectedPayments.reduce((sum, payment) => sum.plus(moneyDecimal(payment.amount)), moneyDecimal(0));
              const refundedInPeriod = periodRefunds.reduce((sum, adjustment) => sum.plus(moneyDecimal(adjustment.amount)), moneyDecimal(0));
              const totalRevenue = collectedGross.minus(refundedInPeriod);
              const collectionRate = totalExpected.greaterThan(0)
                ? Math.min(100, Math.round(collectedAgainstDue.dividedBy(totalExpected).times(100).toNumber()))
                : 0;

              const trendByMonth = new Map<string, number>();
              for (let offset = 11; offset >= 0; offset -= 1) {
                const date = new Date(now.getFullYear(), now.getMonth() - offset, 1);
                trendByMonth.set(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`, 0);
              }
              for (const payment of trendPayments) {
                if (!payment.paidDate) continue;
                const key = `${payment.paidDate.getFullYear()}-${String(payment.paidDate.getMonth() + 1).padStart(2, '0')}`;
                if (trendByMonth.has(key)) trendByMonth.set(key, (trendByMonth.get(key) || 0) + moneyNumber(payment.amount));
              }
              for (const refund of trendRefunds) {
                const key = `${refund.createdAt.getFullYear()}-${String(refund.createdAt.getMonth() + 1).padStart(2, '0')}`;
                if (trendByMonth.has(key)) trendByMonth.set(key, (trendByMonth.get(key) || 0) - moneyNumber(refund.amount));
              }

              const propertyTotals = new Map<string, { name: string; nameAr: string | null; revenue: number }>();
              const methodTotals = new Map<string, { count: number; amount: number }>();
              const tenantTotals = new Map<string, { id: string; name: string; nameAr: string | null; totalPaid: number; paymentCount: number }>();
              const apply = (payment: (typeof collectedPayments)[number], amount: number, countDelta: number) => {
                const property = payment.lease.unit.property;
                const propertyEntry = propertyTotals.get(property.id) || { name: property.name, nameAr: property.nameAr, revenue: 0 };
                propertyEntry.revenue += amount;
                propertyTotals.set(property.id, propertyEntry);
                const method = payment.method || 'other';
                const methodEntry = methodTotals.get(method) || { count: 0, amount: 0 };
                methodEntry.count += countDelta;
                methodEntry.amount += amount;
                methodTotals.set(method, methodEntry);
                const tenant = payment.tenant;
                const tenantEntry = tenantTotals.get(tenant.id) || { id: tenant.id, name: tenant.name, nameAr: tenant.nameAr, totalPaid: 0, paymentCount: 0 };
                tenantEntry.totalPaid += amount;
                tenantEntry.paymentCount += countDelta;
                tenantTotals.set(tenant.id, tenantEntry);
              };
              for (const payment of collectedPayments) apply(payment, moneyNumber(payment.amount), 1);
              for (const refund of periodRefunds) apply(refund.payment as (typeof collectedPayments)[number], -moneyNumber(refund.amount), 0);

              const paymentMethods = ['cash', 'bank_transfer', 'online', 'check'].map((method) => ({
                method,
                count: Math.max(0, methodTotals.get(method)?.count || 0),
                amount: Math.max(0, methodTotals.get(method)?.amount || 0),
              }));
              const other = methodTotals.get('other');
              if (other && other.amount > 0) paymentMethods.push({ method: 'other', count: Math.max(0, other.count), amount: other.amount });

              return NextResponse.json({
                summary: {
                  totalRevenue: totalRevenue.toNumber(),
                  totalExpected: totalExpected.toNumber(),
                  collectionRate,
                  outstandingAmount: outstandingAmount.toNumber(),
                  refundedAmount: refundedInPeriod.toNumber(),
                },
                monthlyRevenue: Array.from(trendByMonth, ([month, revenue]) => ({ month, revenue })),
                revenueByProperty: Array.from(propertyTotals.values()).sort((a, b) => b.revenue - a.revenue),
                paymentMethods,
                topTenants: Array.from(tenantTotals.values()).filter((entry) => entry.totalPaid > 0).sort((a, b) => b.totalPaid - a.totalPaid).slice(0, 10),
              });
            } catch (error) {
              console.error('Reports API error:', error);
              return apiError('Failed to generate reports', 500);
            }
          }

          function PrismaDecimalMax(left: Parameters<typeof moneyDecimal>[0], right: Parameters<typeof moneyDecimal>[0]) {
            const a = moneyDecimal(left);
            const b = moneyDecimal(right);
            return a.greaterThan(b) ? a : b;
          }
          TS

