name: Apply fixed-precision money layer

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: phase3-money
  cancel-in-progress: true

jobs:
  money:
    if: ${{ contains(github.event.head_commit.message, '[start money phase]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Add fixed-precision schema and helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          replacements = {
              '  rentAmount          Float\n': '  rentAmount          Decimal              @db.Decimal(18, 2)\n',
              '  rentAmount     Float\n': '  rentAmount     Decimal      @db.Decimal(18, 2)\n',
              '  deposit        Float?\n': '  deposit        Decimal?     @db.Decimal(18, 2)\n',
              '  amount         Float\n': '  amount         Decimal      @db.Decimal(18, 2)\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected Prisma money field not found: {old!r}')
              text = text.replace(old, new, 1)
          schema.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          data.setdefault('scripts', {})['test'] = 'bun test'
          package.write_text(json.dumps(data, indent=2) + '\n')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          if '- run: bun test' not in ci_text:
              ci_text = ci_text.replace('      - run: bun run typecheck\n', '      - run: bun run typecheck\n      - run: bun test\n')
          ci.write_text(ci_text)

          security = Path('SECURITY.md')
          security_text = security.read_text()
          note = '''\n## Monetary precision\n\nRent, deposit, and payment amounts are stored as PostgreSQL `NUMERIC(18,2)` values. The migration rounds legacy floating-point values to two decimal places before converting the columns and adds non-negative constraints. API responses remain JSON numbers for compatibility, while all persisted arithmetic is backed by Prisma Decimal values.\n'''
          if '## Monetary precision' not in security_text:
              security.write_text(security_text.rstrip() + '\n' + note)
          PY

          mkdir -p prisma/migrations/20260729_decimal_money src/lib tests
          cat > prisma/migrations/20260729_decimal_money/migration.sql <<'SQL'
          -- Convert monetary columns from floating point to fixed precision.
          ALTER TABLE "Unit"
            ALTER COLUMN "rentAmount" TYPE NUMERIC(18,2)
            USING ROUND("rentAmount"::numeric, 2);

          ALTER TABLE "Lease"
            ALTER COLUMN "rentAmount" TYPE NUMERIC(18,2)
            USING ROUND("rentAmount"::numeric, 2),
            ALTER COLUMN "deposit" TYPE NUMERIC(18,2)
            USING CASE WHEN "deposit" IS NULL THEN NULL ELSE ROUND("deposit"::numeric, 2) END;

          ALTER TABLE "Payment"
            ALTER COLUMN "amount" TYPE NUMERIC(18,2)
            USING ROUND("amount"::numeric, 2);

          ALTER TABLE "Unit" DROP CONSTRAINT IF EXISTS "Unit_rentAmount_nonnegative";
          ALTER TABLE "Unit" ADD CONSTRAINT "Unit_rentAmount_nonnegative" CHECK ("rentAmount" >= 0);
          ALTER TABLE "Lease" DROP CONSTRAINT IF EXISTS "Lease_rentAmount_nonnegative";
          ALTER TABLE "Lease" ADD CONSTRAINT "Lease_rentAmount_nonnegative" CHECK ("rentAmount" >= 0);
          ALTER TABLE "Lease" DROP CONSTRAINT IF EXISTS "Lease_deposit_nonnegative";
          ALTER TABLE "Lease" ADD CONSTRAINT "Lease_deposit_nonnegative" CHECK ("deposit" IS NULL OR "deposit" >= 0);
          ALTER TABLE "Payment" DROP CONSTRAINT IF EXISTS "Payment_amount_nonnegative";
          ALTER TABLE "Payment" ADD CONSTRAINT "Payment_amount_nonnegative" CHECK ("amount" >= 0);
          SQL

          cat > src/lib/money.ts <<'TS'
          import { Prisma } from '@prisma/client';

          export type MoneyValue = Prisma.Decimal | string | number;

          export function moneyDecimal(value: MoneyValue) {
            return new Prisma.Decimal(value).toDecimalPlaces(2, Prisma.Decimal.ROUND_HALF_UP);
          }

          export function moneyNumber(value: MoneyValue | null | undefined) {
            if (value === null || value === undefined) return 0;
            return Number(value);
          }

          export function installMoneyRuntime() {
            const prototype = Prisma.Decimal.prototype as any;
            if (prototype.__propManagerMoneyRuntime) return;
            Object.defineProperty(prototype, '__propManagerMoneyRuntime', { value: true });
            prototype.toJSON = function toJSON() {
              return this.toNumber();
            };
            prototype[Symbol.toPrimitive] = function toPrimitive(hint: string) {
              return hint === 'string' ? this.toString() : this.toNumber();
            };
          }
          TS

          cat > tests/money.test.ts <<'TS'
          import { describe, expect, test } from 'bun:test';
          import { installMoneyRuntime, moneyDecimal, moneyNumber } from '@/lib/money';

          describe('money helpers', () => {
            test('adds decimal values without binary floating-point drift', () => {
              const total = moneyDecimal('0.10').plus(moneyDecimal('0.20'));
              expect(total.toFixed(2)).toBe('0.30');
            });

            test('rounds persisted values to two decimal places', () => {
              expect(moneyDecimal('123.455').toFixed(2)).toBe('123.46');
              expect(moneyNumber(moneyDecimal('123.455'))).toBe(123.46);
            });

            test('serializes Decimal values as API-compatible numbers', () => {
              installMoneyRuntime();
              expect(JSON.stringify({ amount: moneyDecimal('19.90') })).toBe('{"amount":19.9}');
            });
          });
          TS

          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/db.ts')
          text = path.read_text()
          import_line = "import { installMoneyRuntime } from '@/lib/money';\n"
          if import_line not in text:
              anchor = "import { SESSION_COOKIE_NAME, verifySessionToken, type SessionPayload } from '@/lib/auth';\n"
              if anchor not in text:
                  raise SystemExit('DB auth import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
          if 'installMoneyRuntime();' not in text:
              anchor = "const DEFAULT_ORGANIZATION_ID = 'org_default';\n"
              text = text.replace(anchor, 'installMoneyRuntime();\n\n' + anchor, 1)
          path.write_text(text)
          PY

      - run: bun ci
      - run: bun run db:generate
      - name: Normalize Decimal values in numeric server expressions
        shell: bash
        run: |
          cat > /tmp/normalize-money.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const moneyFields = new Set(['amount', 'rentAmount', 'deposit']);
          const assignmentOperators = new Set([
            ts.SyntaxKind.EqualsToken,
            ts.SyntaxKind.PlusEqualsToken,
            ts.SyntaxKind.MinusEqualsToken,
            ts.SyntaxKind.AsteriskEqualsToken,
            ts.SyntaxKind.SlashEqualsToken,
            ts.SyntaxKind.PercentEqualsToken,
            ts.SyntaxKind.AsteriskAsteriskEqualsToken,
          ]);
          const numericOperators = new Set([
            ts.SyntaxKind.PlusToken,
            ts.SyntaxKind.MinusToken,
            ts.SyntaxKind.AsteriskToken,
            ts.SyntaxKind.SlashToken,
            ts.SyntaxKind.PercentToken,
            ts.SyntaxKind.AsteriskAsteriskToken,
            ts.SyntaxKind.LessThanToken,
            ts.SyntaxKind.LessThanEqualsToken,
            ts.SyntaxKind.GreaterThanToken,
            ts.SyntaxKind.GreaterThanEqualsToken,
            ts.SyntaxKind.EqualsEqualsToken,
            ts.SyntaxKind.EqualsEqualsEqualsToken,
            ts.SyntaxKind.ExclamationEqualsToken,
            ts.SyntaxKind.ExclamationEqualsEqualsToken,
            ...assignmentOperators,
          ]);

          function collectFiles(target) {
            if (!fs.existsSync(target)) return [];
            const stat = fs.statSync(target);
            if (stat.isFile()) return target.endsWith('.ts') || target.endsWith('.tsx') ? [target] : [];
            return fs.readdirSync(target).flatMap((entry) => collectFiles(path.join(target, entry)));
          }

          function alreadyNumber(node) {
            const parent = node.parent;
            return ts.isCallExpression(parent) && parent.arguments.length === 1 && parent.arguments[0] === node && ts.isIdentifier(parent.expression) && parent.expression.text === 'Number';
          }

          function shouldWrap(node) {
            if (alreadyNumber(node)) return false;
            const parent = node.parent;
            if (ts.isBinaryExpression(parent)) {
              const kind = parent.operatorToken.kind;
              if (!numericOperators.has(kind)) return false;
              if (assignmentOperators.has(kind) && parent.left === node) return false;
              return true;
            }
            if (ts.isPrefixUnaryExpression(parent)) return true;
            if (ts.isCallExpression(parent) && ts.isPropertyAccessExpression(parent.expression)) {
              return ts.isIdentifier(parent.expression.expression) && parent.expression.expression.text === 'Math';
            }
            return false;
          }

          const files = [...collectFiles('src/app/api'), ...collectFiles('prisma/seed.ts')];
          for (const file of files) {
            const sourceText = fs.readFileSync(file, 'utf8');
            const source = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true, file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            const edits = [];
            function visit(node) {
              if (ts.isPropertyAccessExpression(node) && moneyFields.has(node.name.text) && shouldWrap(node)) {
                edits.push({ start: node.getStart(source), end: node.getEnd() });
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            if (!edits.length) continue;
            let next = sourceText;
            for (const edit of edits.sort((a, b) => b.start - a.start)) {
              next = next.slice(0, edit.start) + 'Number(' + next.slice(edit.start, edit.end) + ')' + next.slice(edit.end);
            }
            fs.writeFileSync(file, next);
          }
          JS
          node /tmp/normalize-money.mjs
          rm -f /tmp/normalize-money.mjs .github/workflows/phase3-money.yml

      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run build
      - name: Publish fixed-precision money layer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use fixed-precision monetary storage [money finalized]"
          git push origin HEAD:agent/stabilize-core-workflows
