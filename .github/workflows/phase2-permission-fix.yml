name: Finalize organization switch permission

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: phase2-permission-fix
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[org switch fixed]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Synchronize with any running finalizer
        shell: bash
        run: |
          sleep 75
          git fetch origin agent/stabilize-core-workflows
          git reset --hard origin/agent/stabilize-core-workflows
      - name: Allow every active member to switch organization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/proxy.ts')
          text = path.read_text()
          old = "    if (!SAFE_METHODS.has(request.method) && !canWrite(session.role, pathname)) {\n"
          new = "    const isOrganizationSwitch = pathname === '/api/auth/organizations' && request.method === 'PATCH';\n    if (!SAFE_METHODS.has(request.method) && !isOrganizationSwitch && !canWrite(session.role, pathname)) {\n"
          if old not in text and 'const isOrganizationSwitch' not in text:
              raise SystemExit('Expected permission check was not found')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/phase2-permission-fix.yml
      - run: bun ci
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Publish validated permission correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "fix: allow member organization switching [org switch fixed]"
          git push origin HEAD:agent/stabilize-core-workflows
