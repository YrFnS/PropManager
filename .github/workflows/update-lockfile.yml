name: Refresh Bun lockfile

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh lockfile
        run: bun install --lockfile-only
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/update-lockfile.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Lockfile was already current."
            exit 0
          fi
          git commit -m "chore: refresh Bun lockfile [lockfile updated]"
          git push origin HEAD:agent/stabilize-core-workflows
