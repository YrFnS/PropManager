name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
