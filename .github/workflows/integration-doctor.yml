name: Validate complete stabilization stack

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propmanager-integration-doctor
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ contains(github.event.head_commit.message, '[run integration doctor]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Synchronize completed phase commits
        shell: bash
        run: |
          sleep 60
          git fetch origin agent/stabilize-core-workflows
          git reset --hard origin/agent/stabilize-core-workflows

      - name: Verify required implementation layers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'model Organization' prisma/schema.prisma
          grep -q 'model Membership' prisma/schema.prisma
          grep -q 'model PaymentAdjustment' prisma/schema.prisma
          grep -q 'amount.*Decimal.*@db.Decimal(18, 2)' prisma/schema.prisma
          grep -q 'rentAmount.*Decimal.*@db.Decimal(18, 2)' prisma/schema.prisma
          test -f src/lib/permissions.ts
          test -f src/lib/money.ts
          test -f src/lib/payment-ledger.ts
          test -f 'src/app/api/payments/[id]/void/route.ts'
          test -f 'src/app/api/payments/[id]/refund/route.ts'
          grep -q 'Payments are never deleted' src/app/api/payments/route.ts
          grep -q "canWrite('leases')" src/components/leases/leases-section.tsx
          grep -q 'refundable balance' src/components/payments/payments-section.tsx

      - name: Normalize final TypeScript details and add architecture tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          payments = Path('src/components/payments/payments-section.tsx')
          text = payments.read_text()
          old = "            const statusLabel = (status: string) => ({ pending: copy.pending, paid: copy.paidStatus, late: copy.late, partial: copy.partial, voided: copy.voided, partially_refunded: copy.partially_refunded, refunded: copy.refundedStatus }[status] || status);\n            const methodLabel = (method: string | null) => method ? ({ cash: copy.cash, bank_transfer: copy.bank_transfer, online: copy.online, check: copy.check }[method] || method) : '—';\n"
          new = "            const statusLabels: Record<string, string> = { pending: copy.pending, paid: copy.paidStatus, late: copy.late, partial: copy.partial, voided: copy.voided, partially_refunded: copy.partially_refunded, refunded: copy.refundedStatus };\n            const methodLabels: Record<string, string> = { cash: copy.cash, bank_transfer: copy.bank_transfer, online: copy.online, check: copy.check };\n            const statusLabel = (status: string) => statusLabels[status] || status;\n            const methodLabel = (method: string | null) => method ? methodLabels[method] || method : '—';\n"
          if old in text:
              text = text.replace(old, new, 1)
          payments.write_text(text)

          app = Path('src/components/layout/app-shell.tsx')
          if app.exists():
              app_text = app.read_text()
              if 'canWrite(currentSection)' not in app_text:
                  raise SystemExit('Role-aware AppShell shortcut is missing')

          palette = Path('src/components/layout/command-palette.tsx')
          if palette.exists() and 'actionItems.filter((action) => canWrite(action.section))' not in palette.read_text():
              raise SystemExit('Role-aware command palette filtering is missing')

          security = Path('SECURITY.md')
          body = security.read_text()
          section = '''\n## Immutable payment lifecycle\n\nUnsettled payment entries are voided instead of deleted. Collected payments retain their original amount and receive append-only refund adjustments. Reports calculate net cash by subtracting refund adjustments in the period, and the database prevents cross-organization adjustments.\n'''
          if '## Immutable payment lifecycle' not in body:
              security.write_text(body.rstrip() + '\n' + section)
          PY

          mkdir -p tests
          cat > tests/architecture.test.ts <<'TS'
          import { describe, expect, test } from 'bun:test';
          import { readFileSync } from 'node:fs';

          const read = (path: string) => readFileSync(path, 'utf8');

          describe('stabilization architecture', () => {
            test('all business records are organization owned', () => {
              const schema = read('prisma/schema.prisma');
              for (const model of ['Property', 'PropertyManager', 'Unit', 'Tenant', 'Lease', 'Payment', 'PaymentAdjustment', 'MaintenanceRequest', 'Message', 'ActivityLog']) {
                const block = schema.match(new RegExp(`model ${model} \\{([\\s\\S]*?)\\n\\}`))?.[1] || '';
                expect(block).toContain('organizationId');
              }
            });

            test('money columns use fixed precision', () => {
              const schema = read('prisma/schema.prisma');
              expect(schema).toMatch(/rentAmount\s+Decimal\s+@db\.Decimal\(18, 2\)/);
              expect(schema).toMatch(/amount\s+Decimal\s+@db\.Decimal\(18, 2\)/);
              expect(read('prisma/migrations/20260729_decimal_money/migration.sql')).toContain('NUMERIC(18,2)');
            });

            test('payment history cannot be deleted and adjustments are constrained', () => {
              expect(read('src/app/api/payments/route.ts')).toContain('Payments are never deleted');
              const migration = read('prisma/migrations/20260729_payment_lifecycle/migration.sql');
              expect(migration).toContain('PaymentAdjustment_type_amount_check');
              expect(migration).toContain('PaymentAdjustment_scope_organization');
            });

            test('proxy and client use the same role vocabulary', () => {
              const auth = read('src/lib/auth.ts');
              const permissions = read('src/lib/permissions.ts');
              const proxy = read('src/proxy.ts');
              for (const role of ['owner', 'manager', 'accountant', 'maintenance', 'viewer']) {
                expect(auth).toContain(`'${role}'`);
                expect(permissions).toContain(`${role}:`);
                expect(proxy).toContain(`${role}:`);
              }
            });
          });
          TS

          cat > tests/session.test.ts <<'TS'
          import { beforeAll, describe, expect, test } from 'bun:test';

          beforeAll(() => {
            process.env.AUTH_SECRET = 'test-session-secret-that-is-definitely-longer-than-thirty-two-characters';
          });

          describe('signed organization session', () => {
            test('round-trips organization and role claims and rejects tampering', async () => {
              const { createSessionToken, verifySessionToken } = await import('../src/lib/auth');
              const input = {
                userId: 'user_1', membershipId: 'member_1', email: 'Owner@Example.com', name: 'Owner',
                organizationId: 'org_1', organizationName: 'Example Properties', role: 'owner' as const,
                currency: 'usd', locale: 'en',
              };
              const token = await createSessionToken(input);
              const session = await verifySessionToken(token);
              expect(session?.email).toBe('owner@example.com');
              expect(session?.organizationId).toBe('org_1');
              expect(session?.currency).toBe('USD');
              expect(session?.role).toBe('owner');
              expect(await verifySessionToken(`${token.slice(0, -1)}x`)).toBeNull();
            });
          });
          TS

          rm -f .github/workflows/phase3-money.yml
          rm -f .github/workflows/reconcile-money.yml
          rm -f .github/workflows/phase4-accounting.yml
          rm -f .github/workflows/phase5-role-ui.yml
          rm -f .github/workflows/integration-doctor.yml

      - run: bun ci
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run build

      - name: Commit integrated validated stack
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: validate tenancy money ledger and role-aware workflows [integration validated]"
          git push origin HEAD:agent/stabilize-core-workflows

      - name: Update draft pull request summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## PropManager stabilization release

          This draft PR now combines security, data isolation, accounting integrity, corrected business metrics, and a coordinated finance UI refresh.

          ### Security and tenancy

          - Database-backed users with salted `scrypt` password hashes.
          - Signed HTTP-only sessions carrying the active membership, organization, role, currency, and locale.
          - Owner, manager, accountant, maintenance, and viewer permissions enforced at the API boundary.
          - Automatic organization scoping for all business data plus database triggers that reject cross-organization relationships.
          - Organization switching, organization creation, and owner-controlled member/role management.

          ### Financial integrity

          - PostgreSQL `NUMERIC(18,2)` and Prisma Decimal for rent, deposits, and payments.
          - Non-negative database constraints and invariant tests for rounding and arithmetic.
          - Historical leases preserved with only one active lease allowed per unit.
          - Payment records are immutable: unsettled entries are voided and settled entries receive append-only partial/full refund adjustments.
          - Reports use net cash after refunds, and refund activity is attributed to its tenant and property.

          ### Workflow and UI

          - Rebuilt Payments and Leases screens with responsive layouts, localized currency/dates/CSV, pagination, clear API errors, and role-aware actions.
          - Removed destructive lease/payment controls from normal workflows.
          - Global command actions and keyboard creation shortcuts honor the active role.
          - Organization and role controls are available from the application shell.

          ### Validation

          Repository CI runs a frozen `bun ci`, Prisma generation, TypeScript, architecture and accounting tests, ESLint, and the full Next.js production build. The branch also contains static architecture tests that enforce organization ownership, Decimal money, immutable payment history, migration constraints, and role vocabulary consistency.

          ### Deployment

          1. Back up PostgreSQL.
          2. Configure `.env` from `.env.example`.
          3. Run `bun ci`.
          4. Run `bun run db:migrate:deploy` before starting the new build.
          5. On a new installation, use the configured bootstrap administrator for the first login; this creates the first database owner account.

          The PR remains draft. The separate Vercel status may still be blocked by the connected account's daily free-tier deployment quota; GitHub Actions is the authoritative code/build gate.
          EOF
          gh pr edit 1 --repo YrFnS/PropManager --title "fix: stabilize PropManager tenancy, accounting, and finance workflows" --body-file /tmp/pr-body.md
