name: Apply role-aware controls across legacy screens

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: phase7-role-visibility
  cancel-in-progress: true

jobs:
  visibility:
    if: ${{ contains(github.event.head_commit.message, '[start role visibility]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify integrated prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/architecture.test.ts
          test -f src/lib/permissions.ts
          grep -q 'data.pmRole' src/components/auth/session-provider.tsx

      - run: bun ci

      - name: Mark mutation controls with their resource permission
        shell: bash
        run: |
          cat > /tmp/mark-role-controls.mjs <<'JS'
          import fs from 'node:fs';
          import ts from 'typescript';

          const targets = new Map([
            ['src/components/properties/properties-section.tsx', 'properties'],
            ['src/components/units/units-section.tsx', 'units'],
            ['src/components/tenants/tenants-section.tsx', 'tenants'],
            ['src/components/maintenance/maintenance-section.tsx', 'maintenance'],
            ['src/components/messages/messages-section.tsx', 'messages'],
          ]);

          const mutationPattern = /(add|create|edit|delete|remove|submit|save|markall|markread|toggleRead|openAdd|openEdit|handleOpen|handleDelete|setDelete|setBulkDelete|handleSubmit)/i;
          const exclusionPattern = /(export|receipt|detail|view|search|filter|openReceipt|handlePeriod|toggleSidebar)/i;

          function attributeText(node, source) {
            return node.attributes.properties.map((property) => property.getText(source)).join(' ');
          }

          function hasPermissionAttribute(node) {
            return node.attributes.properties.some((property) => ts.isJsxAttribute(property) && property.name.text === 'data-pm-write-resource');
          }

          function tagName(node) {
            return node.tagName.getText();
          }

          function shouldMark(node, source, resource) {
            if (hasPermissionAttribute(node)) return false;
            const tag = tagName(node);
            const attrs = attributeText(node, source);
            if (tag === 'Checkbox' && resource === 'units') return true;
            if (tag === 'TabsTrigger' && resource === 'maintenance' && /value=["']board["']/.test(attrs)) return true;
            if (!['Button', 'AlertDialogAction'].includes(tag)) return false;
            if (/type=["']submit["']/.test(attrs)) return true;
            if (!/onClick=/.test(attrs)) return false;
            if (exclusionPattern.test(attrs)) return false;
            return mutationPattern.test(attrs);
          }

          for (const [file, resource] of targets) {
            if (!fs.existsSync(file)) throw new Error(`Missing target ${file}`);
            const text = fs.readFileSync(file, 'utf8');
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const edits = [];
            function visit(node) {
              if ((ts.isJsxOpeningElement(node) || ts.isJsxSelfClosingElement(node)) && shouldMark(node, source, resource)) {
                const position = node.tagName.end;
                edits.push({ position, insertion: ` data-pm-write-resource="${resource}"` });
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            if (!edits.length) throw new Error(`No mutation controls were found in ${file}`);
            let next = text;
            for (const edit of edits.sort((a, b) => b.position - a.position)) {
              next = next.slice(0, edit.position) + edit.insertion + next.slice(edit.position);
            }
            fs.writeFileSync(file, next);
          }
          JS
          node /tmp/mark-role-controls.mjs
          rm -f /tmp/mark-role-controls.mjs

          cat >> src/app/stabilization.css <<'CSS'

          /* UI visibility mirrors the server-side role matrix. The API remains authoritative. */
          html[data-pm-role='viewer'] [data-pm-write-resource] {
            display: none !important;
          }

          html[data-pm-role='maintenance'] [data-pm-write-resource]:not([data-pm-write-resource='maintenance']):not([data-pm-write-resource='messages']) {
            display: none !important;
          }

          html[data-pm-role='accountant'] [data-pm-write-resource]:not([data-pm-write-resource='tenants']):not([data-pm-write-resource='leases']):not([data-pm-write-resource='payments']):not([data-pm-write-resource='messages']) {
            display: none !important;
          }
          CSS

          cat > tests/role-visibility.test.ts <<'TS'
          import { describe, expect, test } from 'bun:test';
          import { readFileSync } from 'node:fs';

          const targets = {
            properties: 'src/components/properties/properties-section.tsx',
            units: 'src/components/units/units-section.tsx',
            tenants: 'src/components/tenants/tenants-section.tsx',
            maintenance: 'src/components/maintenance/maintenance-section.tsx',
            messages: 'src/components/messages/messages-section.tsx',
          } as const;

          describe('role-aware legacy controls', () => {
            for (const [resource, file] of Object.entries(targets)) {
              test(`${resource} mutation controls are permission tagged`, () => {
                expect(readFileSync(file, 'utf8')).toContain(`data-pm-write-resource="${resource}"`);
              });
            }

            test('visibility rules preserve accountant and maintenance responsibilities', () => {
              const css = readFileSync('src/app/stabilization.css', 'utf8');
              expect(css).toContain("data-pm-role='viewer'");
              expect(css).toContain("data-pm-role='maintenance'");
              expect(css).toContain("data-pm-write-resource='maintenance'");
              expect(css).toContain("data-pm-role='accountant'");
              expect(css).toContain("data-pm-write-resource='payments'");
            });
          });
          TS

          rm -f .github/workflows/phase7-role-visibility.yml

      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run build

      - name: Publish validated role visibility layer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: hide unavailable mutations across role-scoped screens [role visibility finalized]"
          git push origin HEAD:agent/stabilize-core-workflows
