name: Publish validated browser and migration rehearsal

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/stabilize-core-workflows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d propmanager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      LEGACY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager_legacy?schema=public
      LEGACY_PSQL_URL: postgresql://postgres:postgres@localhost:5432/propmanager_legacy
      AUTH_SECRET: rehearsal-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: owner@example.com
      ADMIN_PASSWORD: OwnerPassword123!
      ADMIN_NAME: Rehearsal Owner
      DEFAULT_ORGANIZATION_NAME: Rehearsal Properties
      DEFAULT_CURRENCY: USD
      DEFAULT_TIMEZONE: UTC
      ENABLE_AI_COPILOT: "false"
      CI: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - name: Check publication marker
        id: gate
        shell: bash
        run: |
          if [ -f .rehearsal-publish-ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.gate.outputs.ready == 'true' }}
        with:
          bun-version: latest
      - name: Put migrations in dependency order
        if: ${{ steps.gate.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git mv prisma/migrations/20260729_stabilize_relations prisma/migrations/20260729_0001_stabilize_relations
          git mv prisma/migrations/20260729_multi_org_rbac prisma/migrations/20260729_0002_multi_org_rbac
          git mv prisma/migrations/20260729_decimal_money prisma/migrations/20260729_0003_decimal_money
          git mv prisma/migrations/20260729_payment_lifecycle prisma/migrations/20260729_0004_payment_lifecycle

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '20260729_stabilize_relations': '20260729_0001_stabilize_relations',
              '20260729_multi_org_rbac': '20260729_0002_multi_org_rbac',
              '20260729_decimal_money': '20260729_0003_decimal_money',
              '20260729_payment_lifecycle': '20260729_0004_payment_lifecycle',
          }
          excluded = {'.git', 'node_modules', '.next'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY

          test -f prisma/migrations/20260729_0001_stabilize_relations/migration.sql
          test -f prisma/migrations/20260729_0002_multi_org_rbac/migration.sql
          test -f prisma/migrations/20260729_0003_decimal_money/migration.sql
          test -f prisma/migrations/20260729_0004_payment_lifecycle/migration.sql
          git diff --check
      - name: Install and lock Playwright
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun add --dev @playwright/test@latest
      - name: Verify frozen dependency graph
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun ci
      - name: Generate Prisma client
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun run db:generate
      - name: Rehearse fresh and legacy migrations
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bash scripts/rehearse-migrations.sh
      - name: Typecheck
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun run typecheck
      - name: Unit tests
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun test tests
      - name: Lint
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun run lint
      - name: Production build
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun run build
      - name: Install Chromium
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: bun run test:e2e
      - name: Publish validated rehearsal layer
        if: ${{ steps.gate.outputs.ready == 'true' && success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .rehearsal-publish-ready
          rm -f .github/workflows/bootstrap-rehearsal.yml
          rm -f .github/workflows/publish-rehearsal.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: validate migration order and browser permissions"
          git push origin HEAD:agent/stabilize-core-workflows
      - name: Report publication failure
        if: ${{ steps.gate.outputs.ready == 'true' && failure() }}
        shell: bash
        run: |
          gh pr comment 1 --repo YrFnS/PropManager --body "The visible rehearsal publisher failed. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Report publication success
        if: ${{ steps.gate.outputs.ready == 'true' && success() }}
        shell: bash
        run: |
          gh pr comment 1 --repo YrFnS/PropManager --body "Migration ordering, fresh and legacy database rehearsals, production validation, and Chromium permission smoke tests passed."
