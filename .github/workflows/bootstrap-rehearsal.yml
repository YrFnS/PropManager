name: Bootstrap browser and migration rehearsal

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: bootstrap-browser-rehearsal
  cancel-in-progress: true

jobs:
  setup:
    if: ${{ contains(github.event.head_commit.message, '[setup rehearsal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d propmanager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      LEGACY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager_legacy?schema=public
      LEGACY_PSQL_URL: postgresql://postgres:postgres@localhost:5432/propmanager_legacy
      AUTH_SECRET: rehearsal-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: owner@example.com
      ADMIN_PASSWORD: OwnerPassword123!
      ADMIN_NAME: Rehearsal Owner
      DEFAULT_ORGANIZATION_NAME: Rehearsal Properties
      DEFAULT_CURRENCY: USD
      DEFAULT_TIMEZONE: UTC
      ENABLE_AI_COPILOT: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Put migrations in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [ -d prisma/migrations/20260729_stabilize_relations ]; then
            git mv prisma/migrations/20260729_stabilize_relations prisma/migrations/20260729_0001_stabilize_relations
          fi
          if [ -d prisma/migrations/20260729_multi_org_rbac ]; then
            git mv prisma/migrations/20260729_multi_org_rbac prisma/migrations/20260729_0002_multi_org_rbac
          fi
          if [ -d prisma/migrations/20260729_decimal_money ]; then
            git mv prisma/migrations/20260729_decimal_money prisma/migrations/20260729_0003_decimal_money
          fi
          if [ -d prisma/migrations/20260729_payment_lifecycle ]; then
            git mv prisma/migrations/20260729_payment_lifecycle prisma/migrations/20260729_0004_payment_lifecycle
          fi

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '20260729_stabilize_relations': '20260729_0001_stabilize_relations',
              '20260729_multi_org_rbac': '20260729_0002_multi_org_rbac',
              '20260729_decimal_money': '20260729_0003_decimal_money',
              '20260729_payment_lifecycle': '20260729_0004_payment_lifecycle',
          }
          excluded = {'.git', 'node_modules', '.next'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY

          test -f prisma/migrations/20260729_0001_stabilize_relations/migration.sql
          test -f prisma/migrations/20260729_0002_multi_org_rbac/migration.sql
          test -f prisma/migrations/20260729_0003_decimal_money/migration.sql
          test -f prisma/migrations/20260729_0004_payment_lifecycle/migration.sql
          git diff --check
      - name: Install and lock Playwright
        run: bun add --dev @playwright/test@latest
      - run: bun ci
      - run: bun run db:generate
      - run: bash scripts/rehearse-migrations.sh
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run lint
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Publish validated rehearsal layer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-rehearsal.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: add browser and migration rehearsal"
          git push origin HEAD:agent/stabilize-core-workflows
