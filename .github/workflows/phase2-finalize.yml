name: Finalize organization access layer

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write

concurrency:
  group: phase2-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase2 finalized]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove interrupted payload artifacts
        shell: bash
        run: |
          rm -f .phase2-payload.part-* .phase2b-payload.part-* .github/workflows/phase2-finalize.yml
      - run: bun ci
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Publish validated organization layer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to finalize."
            exit 0
          fi
          git commit -m "feat: finalize multi-organization access control [phase2 finalized]"
          git push origin HEAD:agent/stabilize-core-workflows
