name: Apply validated pending stabilization phase

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pending-stabilization-phase
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      contains(github.event.head_commit.message, '[apply phase4]') ||
      contains(github.event.head_commit.message, '[apply phase5]') ||
      contains(github.event.head_commit.message, '[apply phase7]')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Execute the selected validated phase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          message = os.environ['COMMIT_MESSAGE']
          phases = {
              '[apply phase4]': (Path('.github/workflows/phase4-accounting.yml'), 'accounting', 'immutable payment lifecycle'),
              '[apply phase5]': (Path('.github/workflows/phase5-role-ui.yml'), 'role-ui', 'role-aware finance UI'),
              '[apply phase7]': (Path('.github/workflows/phase7-role-visibility.yml'), 'visibility', 'legacy-screen role visibility'),
          }
          selected = next((value for marker, value in phases.items() if marker in message), None)
          if not selected:
              raise SystemExit('No supported phase marker was found.')

          path, job_name, phase_name = selected
          Path('/tmp/phase-name.txt').write_text(phase_name)
          preserved_session_provider = None
          if phase_name == 'role-aware finance UI':
              preserved_session_provider = Path('src/components/auth/session-provider.tsx').read_text()

          lines = path.read_text().splitlines()
          job_marker = f'  {job_name}:'
          try:
              start = lines.index(job_marker) + 1
          except ValueError as error:
              raise SystemExit(f'Job {job_name!r} was not found in {path}.') from error

          scripts = []
          current_name = 'run'
          index = start
          while index < len(lines):
              line = lines[index]
              if line.startswith('  ') and not line.startswith('    ') and line.rstrip().endswith(':'):
                  break
              if line.startswith('      - name:'):
                  current_name = line.split(':', 1)[1].strip()
              elif line.startswith('      - run:'):
                  value = line.split('run:', 1)[1].strip()
                  if value and value != '|':
                      scripts.append((current_name, value))
                      current_name = 'run'
              elif line.startswith('        run:'):
                  value = line.split('run:', 1)[1].strip()
                  if value and value != '|':
                      scripts.append((current_name, value))
                      current_name = 'run'
                  else:
                      block_indent = len(line) - len(line.lstrip())
                      content_prefix = ' ' * (block_indent + 2)
                      raw = []
                      cursor = index + 1
                      while cursor < len(lines):
                          candidate = lines[cursor]
                          if candidate.startswith('      - '):
                              break
                          if candidate.startswith('  ') and not candidate.startswith('    ') and candidate.rstrip().endswith(':'):
                              break
                          raw.append(candidate)
                          cursor += 1
                      script = '\n'.join(
                          item[len(content_prefix):] if item.startswith(content_prefix) else item.lstrip()
                          for item in raw
                      )
                      scripts.append((current_name, script))
                      current_name = 'run'
                      index = cursor - 1
              index += 1

          def run_script(name, command):
              print(f'::group::{name}')
              process = subprocess.run(
                  ['bash', '-lc', command],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  env=os.environ.copy(),
              )
              print(process.stdout, end='')
              print('::endgroup::')
              if process.returncode:
                  tail = '\n'.join(process.stdout.splitlines()[-120:])
                  Path('/tmp/phase-failure.md').write_text(
                      f'### Pending stabilization phase failed\n\n'
                      f'Phase: **{phase_name}**  \nStep: **{name}**\n\n'
                      f'```text\n{tail}\n```\n'
                  )
                  raise SystemExit(process.returncode)

          for name, script in scripts:
              if name.lower().startswith('publish'):
                  continue
              if phase_name == 'legacy-screen role visibility' and name == 'Mark mutation controls with their resource permission':
                  run_script('Strictly tag legacy mutation controls', 'node scripts/mark-role-controls.mjs')
              filtered = '\n'.join(
                  line for line in script.splitlines()
                  if not ('rm -f' in line and '.github/workflows/' in line)
              )
              run_script(name, filtered)
              if preserved_session_provider is not None and name == 'Add shared permission rules and tests':
                  Path('src/components/auth/session-provider.tsx').write_text(preserved_session_provider)

          if phase_name == 'legacy-screen role visibility':
              Path('scripts/mark-role-controls.mjs').unlink(missing_ok=True)
          PY
          git diff --check
      - name: Publish the validated phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The selected phase made no changes."
            exit 0
          fi
          phase_name="$(cat /tmp/phase-name.txt)"
          git commit -m "feat: apply ${phase_name}"
          git push origin HEAD:agent/stabilize-core-workflows
      - name: Report failure on the draft PR
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/phase-failure.md ]; then
            gh pr comment 1 --repo YrFnS/PropManager --body-file /tmp/phase-failure.md
          else
            gh pr comment 1 --repo YrFnS/PropManager --body "A pending stabilization phase failed before it could produce a detailed diagnostic."
          fi
      - name: Report successful publication
        if: success()
        shell: bash
        run: |
          phase_name="$(cat /tmp/phase-name.txt)"
          gh pr comment 1 --repo YrFnS/PropManager --body "Published and validated the **${phase_name}** phase. The normal CI workflow will now verify the committed result."
