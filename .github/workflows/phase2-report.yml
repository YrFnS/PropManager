name: Report organization access validation

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    if: ${{ contains(github.event.head_commit.message, '[org switch fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - name: Update draft PR summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stabilization progress

          The branch now includes the original security and workflow stabilization plus the validated multi-organization access layer.

          ### Completed

          - Signed, HTTP-only application sessions and localized login.
          - Database-backed users with `scrypt` password hashes.
          - Organizations and user memberships with owner, manager, accountant, maintenance, and viewer roles.
          - Automatic organization scoping for every property, unit, tenant, lease, payment, maintenance request, message, and audit entry.
          - Database constraints and triggers that reject cross-organization relationships.
          - Organization switching for every active member.
          - Owner controls for organization creation, user creation, and role management.
          - Corrected property, lease, payment, dashboard, report, and maintenance workflows from the first stabilization phase.
          - Frozen dependency install, Prisma generation, TypeScript, ESLint, and production build validation.

          ### Deployment requirements

          1. Back up PostgreSQL.
          2. Configure `.env` from `.env.example`.
          3. Run `bun ci`.
          4. Run `bun run db:migrate:deploy` before starting the new build.
          5. Complete the first login with the configured bootstrap administrator to create the first owner account.

          ### Remaining planned work

          - Fixed-precision monetary storage and accounting-safe void/refund flows.
          - Distributed production rate limiting.
          - More role-aware hiding of unavailable UI actions.
          - Record-specific search deep links and broader end-to-end tests.

          The separate Vercel deployment check may still report the connected account's daily free-tier deployment quota; repository CI is the authoritative compiler and build gate for this PR.
          EOF
          gh pr edit 1 --repo YrFnS/PropManager --body-file /tmp/pr-body.md
      - name: Remove one-time reporter
        shell: bash
        run: |
          git rm .github/workflows/phase2-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record organization validation [phase2 reported]"
          git push origin HEAD:agent/stabilize-core-workflows
