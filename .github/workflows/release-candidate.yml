name: Finalize PropManager stabilization release candidate

on:
  push:
    branches:
      - agent/stabilize-core-workflows

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propmanager-release-candidate
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[finalize release candidate]') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propmanager?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password
      ENABLE_AI_COPILOT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-core-workflows
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Synchronize latest validated phase
        shell: bash
        run: |
          sleep 45
          git fetch origin agent/stabilize-core-workflows
          git reset --hard origin/agent/stabilize-core-workflows

      - name: Verify release-candidate architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/architecture.test.ts
          test -f tests/money.test.ts
          test -f tests/payment-ledger.test.ts
          test -f tests/permissions.test.ts
          test -f tests/role-visibility.test.ts
          grep -q 'model Organization' prisma/schema.prisma
          grep -q 'model PaymentAdjustment' prisma/schema.prisma
          grep -q 'Decimal.*@db.Decimal(18, 2)' prisma/schema.prisma
          grep -q 'data-pm-write-resource="properties"' src/components/properties/properties-section.tsx
          grep -q 'data-pm-write-resource="maintenance"' src/components/maintenance/maintenance-section.tsx
          grep -q 'Payments are never deleted' src/app/api/payments/route.ts

      - name: Record deployment and rollback runbook
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/STABILIZATION_RELEASE.md <<'MD'
          # PropManager stabilization release

          This release converts the original single-user prototype into an authenticated, organization-scoped property-management application with fixed-precision financial storage and an immutable payment lifecycle.

          ## Before deployment

          1. Take a verified PostgreSQL backup.
          2. Check for duplicate unit numbers inside the same property. The migration stops rather than silently renaming records.
          3. Copy `.env.example` to the deployment environment and set a random `AUTH_SECRET`, bootstrap administrator credentials, and the default organization settings.
          4. Keep `ENABLE_DANGEROUS_ADMIN_ACTIONS=false` and `ENABLE_AI_COPILOT=false` unless those features have been deliberately reviewed.

          ## Deployment sequence

          ```bash
          bun ci
          bun run db:generate
          bun run db:migrate:deploy
          bun run typecheck
          bun test
          bun run lint
          bun run build
          bun run start
          ```

          Run database migrations before routing production traffic to the new build. The migrations are ordered as follows:

          1. lease-history and relationship stabilization;
          2. organization ownership, users, memberships, and cross-organization constraints;
          3. `NUMERIC(18,2)` monetary conversion;
          4. append-only payment void/refund adjustments.

          ## First login

          On an empty `User` table, the configured bootstrap administrator creates the first database user, default organization, and owner membership. Environment credentials stop acting as a fallback after the first user exists.

          ## Roles

          - **Owner:** all operational and organization-administration actions.
          - **Manager:** day-to-day property, tenant, lease, payment, maintenance, and message actions.
          - **Accountant:** tenant, lease, payment, and message actions.
          - **Maintenance:** maintenance and message actions.
          - **Viewer:** read-only access.

          The API/proxy is authoritative. UI controls are also hidden where a role lacks the corresponding permission.

          ## Financial behavior

          - Rent, deposits, and payments use PostgreSQL `NUMERIC(18,2)` and Prisma Decimal.
          - Historical leases are preserved; only one active lease is allowed per unit.
          - Payments are never deleted.
          - Pending or late entries are voided with a reason.
          - Collected entries receive append-only partial/full refund adjustments.
          - Reports calculate net cash after refunds.

          ## Rollback

          Do not attempt to down-migrate monetary or organization data in place. If rollback is required:

          1. stop application traffic;
          2. preserve the failed deployment database for investigation;
          3. restore the pre-deployment PostgreSQL backup;
          4. deploy the prior application revision;
          5. verify tenant, lease, payment, and organization counts before reopening traffic.

          ## Validation

          CI uses a frozen `bun ci` and runs Prisma generation, TypeScript, architecture/accounting/permission tests, ESLint, and the complete Next.js production build.
          MD

          rm -f .github/workflows/phase2-finalize.yml
          rm -f .github/workflows/phase2-permission-fix.yml
          rm -f .github/workflows/phase2-report.yml
          rm -f .github/workflows/phase3-money.yml
          rm -f .github/workflows/reconcile-money.yml
          rm -f .github/workflows/phase4-accounting.yml
          rm -f .github/workflows/phase5-role-ui.yml
          rm -f .github/workflows/integration-doctor.yml
          rm -f .github/workflows/retry-integration-doctor.yml
          rm -f .github/workflows/phase7-role-visibility.yml
          rm -f .github/workflows/release-candidate.yml
          rm -f .phase2-payload.part-* .phase2b-payload.part-* .stabilization-payload.part-* .stabilization-payload.ready

      - run: bun ci
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run build

      - name: Publish clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize validated PropManager stabilization release candidate [release candidate ready]"
          git push origin HEAD:agent/stabilize-core-workflows

      - name: Refresh draft PR summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## PropManager stabilization release candidate

          This draft PR implements the security, tenancy, accounting, workflow, and UI repairs identified in the repository audit.

          ### Delivered

          - Database-backed users, salted `scrypt` passwords, signed HTTP-only sessions, and a localized login flow.
          - Organizations, memberships, owner/manager/accountant/maintenance/viewer roles, API permission enforcement, organization switching, and owner member management.
          - Automatic organization scoping for every business model plus PostgreSQL triggers that reject cross-organization relationships.
          - Historical lease preservation with only one active lease per unit.
          - PostgreSQL `NUMERIC(18,2)` and Prisma Decimal for rents, deposits, and payments.
          - Immutable payment history: pending/late entries are voided; collected entries use append-only partial/full refund adjustments.
          - Net-cash reports after refunds and corrected occupancy/revenue calculations.
          - Rebuilt Payments and Leases screens with localized currency/dates/CSV, pagination, responsive layouts, lifecycle controls, and role-aware actions.
          - Role-aware command actions, keyboard shortcuts, and mutation controls across properties, units, tenants, maintenance, and messages.
          - CI with frozen dependency installation, Prisma generation, TypeScript, architecture/accounting/permission tests, ESLint, and full production build.

          ### Deployment

          Follow `docs/STABILIZATION_RELEASE.md`. Back up PostgreSQL, configure `.env`, run `bun ci`, then run `bun run db:migrate:deploy` before starting the new build.

          ### Important deployment notes

          - The organization migration backfills existing data into `org_default`.
          - The monetary migration rounds legacy floating-point values to two decimals.
          - Duplicate unit numbers inside one property must be resolved before migration.
          - Keep destructive admin endpoints and AI Copilot disabled unless explicitly reviewed.
          - The PR remains draft for deployment review and database-backup confirmation.

          The separate Vercel status can remain blocked by the connected account's free-tier deployment quota; repository CI is the authoritative code and build gate.
          EOF
          gh pr edit 1 --repo YrFnS/PropManager --title "fix: stabilize PropManager tenancy, accounting, and UI workflows" --body-file /tmp/pr-body.md
